  <style>

    /* =========================================================================

      function optimisticReaction(collection, targetId, reaction) {
        if (!state.data[collection] || typeof state.data[collection] !== 'object' || Array.isArray(state.data[collection])) state.data[collection] = {};
        var bucket = state.data[collection];
        var before = bucket[targetId] ? JSON.parse(JSON.stringify(bucket[targetId])) : null;
        var current = normalizeReactionSummary(bucket[targetId]);
        var counts = current.counts;
        if (current.userVote === reaction) {
          counts[reaction] = Math.max(0, (Number(counts[reaction]) || 0) - 1);
          current.userVote = null;
        } else {
          if (current.userVote) counts[current.userVote] = Math.max(0, (Number(counts[current.userVote]) || 0) - 1);
          counts[reaction] = (Number(counts[reaction]) || 0) + 1;
          current.userVote = reaction;
        }
        var next = { counts: counts, userVote: current.userVote };
        bucket[targetId] = next;
        paintReactionDom(collection, targetId, next);
        return before;
      }

    function stopAutoScroll() {
      if (readerAutoFrame) {
        window.cancelAnimationFrame(readerAutoFrame);
        readerAutoFrame = null;
      }
      if (readerAutoScrollBehaviorSaved) {
        document.documentElement.style.scrollBehavior = '';
        readerAutoScrollBehaviorSaved = false;
      }
      state.autoScroll = false;
    }

    function toggleAutoScroll() {
      if (readerAutoFrame) {
        stopAutoScroll();
        render();
        return;
      }
      if (prefersReducedMotion()) {
        state.autoScroll = false;
        render();
        return;
      }
      state.autoScroll = true;
      if (!readerAutoScrollBehaviorSaved) {
        readerAutoScrollBehaviorSaved = true;
        document.documentElement.style.scrollBehavior = 'auto';
      }
      var lastTick = 0;
      var tick = function (now) {
        if (!lastTick) lastTick = now;
        var elapsed = Math.min(64, now - lastTick);
        lastTick = now;
        if (document.hidden || state.route !== 'reader') {
          stopAutoScroll();
          render();
          return;
        }
        var doc = document.documentElement;
        var maxScroll = doc.scrollHeight - window.innerHeight;
        if (doc.scrollTop >= maxScroll - 1) {
          stopAutoScroll();
          render();
          return;
        }
        window.scrollBy(0, (state.autoScrollSpeed || 2.5) * (elapsed / 16.67));
        readerAutoFrame = window.requestAnimationFrame(tick);
      };
      readerAutoFrame = window.requestAnimationFrame(tick);
      render();
    }

    var apiSyncQueue = Promise.resolve();
    function parseApiResponse(res) {

        return json;
      });

    function apiPublicWrite(path, payload) {
      if (!CONFIG.API_BASE_URL) {
        toast('Backend tidak terhubung.', 'error');
        return Promise.reject(new Error('Backend tidak terhubung.'));
      }
      var headers = { 'Content-Type': 'application/json' };
      if (state.adminToken) headers.Authorization = 'Bearer ' + state.adminToken;
      return fetch(CONFIG.API_BASE_URL + path, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(payload || {})
      }).then(parseApiResponse);
    }
    function apiSync(path, payload, successMessage) {
      if (!CONFIG.API_BASE_URL || !state.adminToken) {
        toast('Backend tidak terhubung.', 'error');
        state.data = readCachedCatalog();
        render();
        return Promise.resolve(false);
      }
      apiSyncQueue = apiSyncQueue.then(function () {
        return fetch(CONFIG.API_BASE_URL + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.adminToken },
          body: JSON.stringify(payload)
        }).then(function (res) {
          if (isSessionUnauthorized(res)) {
            clearSession();
            toast('Sesi admin berakhir. Silakan login ulang.', 'error');
            throw new Error('Sesi admin berakhir');
          }
          if (res.status === 401) throw new Error('Autentikasi tidak dapat diverifikasi.');
          return parseApiResponse(res);
        });
      }).then(function () {
        if (successMessage) toast(successMessage, 'ok');
        return syncFromApi(true);
      }).then(function () {
        return true;
      }).catch(function (err) {
        if (err && err.message === 'Sesi admin berakhir') {
          state.data = readCachedCatalog();
          render();
        } else {
          toast('Gagal menyimpan ke server (' + path + '): ' + (err && err.message ? err.message : err), 'error');
          state.data = readCachedCatalog();
          render();
          syncFromApi(true);
        }
        return false;
      });
      return apiSyncQueue;
    }

        var rect = el.getBoundingClientRect();

        var current = document.getElementById('kv-md-lang-value');

    function loadAdminAnalytics(from, to) {
       if (!CONFIG.API_BASE_URL || !state.adminToken) {
         state.analyticsData = null;
         state.analyticsError = 'Backend tidak terhubung.';
         render();
         return;
       }
        var f = from || (state.analyticsFrom || '');
        var t = to || (state.analyticsTo || '');
        if (!f || !t) return;
        state.analyticsRequestId = (state.analyticsRequestId || 0) + 1;
        var requestId = state.analyticsRequestId;
        fetch(CONFIG.API_BASE_URL + '/api/analytics?from=' + encodeURIComponent(f) + '&to=' + encodeURIComponent(t), { headers: { 'Authorization': 'Bearer ' + state.adminToken } })
          .then(function (r) {
            if (isSessionUnauthorized(r)) {
              clearSession();
              throw new Error('Sesi admin berakhir. Silakan login ulang.');
            }
            if (r.status === 401) throw new Error('Gagal memuat analitik (HTTP 401).');
            if (!r.ok) throw new Error('Gagal memuat analitik (HTTP ' + r.status + ').');
           return r.json();
         })
         .then(function (res) {
           if (requestId !== state.analyticsRequestId) return;
           state.analyticsData = res; state.analyticsError = ''; render();
         })
         .catch(function (e) {
           if (requestId !== state.analyticsRequestId) return;
           state.analyticsData = null; state.analyticsError = (e && e.message) ? e.message : 'Gagal memuat analitik.'; render();
         });
     }

    function loadAdminUsers() {
      if (!CONFIG.API_BASE_URL || !state.adminToken) {
        state.usersCache = [];
        state.usersError = 'Backend tidak terhubung.';
        render();
        return;
      }
      state.usersError = '';
      fetch(CONFIG.API_BASE_URL + '/api/admin/users', { headers: { 'Authorization': 'Bearer ' + state.adminToken } })
        .then(function (r) {
          if (isSessionUnauthorized(r)) {
            clearSession();
            throw new Error('Sesi admin berakhir. Silakan login ulang.');
          }
          if (r.status === 401) throw new Error('Gagal memuat pengguna (HTTP 401).');
          if (!r.ok) throw new Error('Gagal memuat pengguna (HTTP ' + r.status + ').');
          return r.json();
        })
        .then(function (res) { state.usersCache = res.users || []; state.usersError = ''; render(); })
        .catch(function (e) { state.usersCache = []; state.usersError = (e && e.message) ? e.message : 'Gagal memuat pengguna.'; render(); });
    }

            '<span class="kv-user-role-option-mark" aria-hidden="true">' + opt.label.charAt(0) + '</span>' +
            '<span class="kv-user-role-option-body"><strong>' + opt.label + '</strong><small>' + opt.desc + '</small></span>' +
            '<span class="kv-user-role-option-check" aria-hidden="true">' + (active ? '✓' : '') + '</span>' +

            '<button type="button" class="kv-user-role-btn" data-action="admin-toggle-role-menu" data-id="' + roleId + '" aria-haspopup="listbox" aria-expanded="' + (roleOpen ? 'true' : 'false') + '" aria-label="Ubah peran ' + escapeHtml(u.name) + '">' +
              '<span class="kv-user-role-btn-dot ' + roleValue + '" aria-hidden="true"></span>' +

              '<div class="kv-user-role-panel-head"><span>Hak akses</span><span>' + roleValue + '</span></div>' +

              '<div class="kv-user-name">' + escapeHtml(u.name) + (isSelf ? ' <span class="kv-user-self">(Anda)</span>' : '') + '</div>' +
              '<div class="kv-user-email">' + escapeHtml(u.email || '-') + '</div>' +

            (isSelf ? '' : '<button type="button" class="kv-btn kv-btn-danger-ghost" data-action="admin-delete-user" data-id="' + escapeHtml(u.id) + '">Hapus</button>') +

      }).join('');
      return '<div class="kv-card"><h3>Daftar Pengguna (' + state.usersCache.length + ')</h3>' +
        '<p style="color:var(--kv-text-muted);font-size:0.8125rem;margin:4px 0 14px;">Kelola peran akses dan status akun pengguna terdaftar.</p>' +
        (rows ? '<div class="kv-user-grid">' + rows + '</div>' : '<p class="kv-admin-empty">Belum ada pengguna terdaftar.</p>') +

    function changeUserRoleAdmin(userId, role) {
      if (!CONFIG.API_BASE_URL || !state.adminToken) { toast('Backend tidak terhubung.', 'error'); return; }
      fetch(CONFIG.API_BASE_URL + '/api/admin/user-role', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.adminToken },
        body: JSON.stringify({ id: userId, role: role })
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, sessionError: isSessionUnauthorized(r), body: j }; });
      }).then(function (res) {
        if (res.sessionError) {
          clearSession();
          throw new Error('Sesi admin berakhir. Silakan login ulang.');
        }
        if (res.status === 401) throw new Error('Gagal mengubah role (HTTP 401).');
        if (!res.ok) throw new Error(res.body && res.body.error ? res.body.error : ('HTTP ' + res.status));
        if (state.usersCache) {
          state.usersCache = state.usersCache.map(function (u) { if (u.id === userId) { u.role = role; } return u; });
        }
        toast('Role berhasil diubah menjadi ' + role + '.', 'success');
        render();
      }).catch(function (e) { toast(e.message || 'Gagal mengubah role.', 'error'); state.usersCache = undefined; loadAdminUsers(); });
    }
    function persistSiteSettings(values) {
      if (!CONFIG.API_BASE_URL || !state.adminToken) {
        toast('Backend tidak terhubung.', 'error');
        return Promise.resolve(false);
      }
      var current = (state.data && state.data.settings) || {};
      values = Object.assign({}, current, values);
      return fetch(CONFIG.API_BASE_URL + '/api/admin/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.adminToken },
        body: JSON.stringify(values)
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (isSessionUnauthorized(r)) {
            clearSession();
            throw new Error('Sesi admin berakhir. Silakan login ulang.');
          }
          if (r.status === 401) throw new Error('HTTP 401');
          if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
          return j.settings || values;
        });
      }).then(function (saved) {
        state.data.settings = Object.assign({}, saved || {}, values);
        toast('Pengaturan disimpan.', 'ok');
        render();
        return true;
      }).catch(function (err) {
        toast('Gagal menyimpan pengaturan: ' + (err && err.message ? err.message : err), 'error');
        render();
        return false;
      });
    }

    function brandModeOptions() {
      return [
        { value: 'logo-name', mark: 'LN', label: 'Logo + Nama', desc: 'Logo dan nama situs tampil berdampingan.' },
        { value: 'logo-only', mark: 'L', label: 'Hanya Logo', desc: 'Tampilkan logo saja bila URL logo tersedia.' },

        '</div>' +
        '<select class="kv-select kv-brand-mode-native" name="brandMode" aria-label="Tampilan Brand">' + nativeHtml + '</select>' +
      '</div>';
    }

    function setBrandModePanel(open) {
      var btn = document.getElementById('kv-brand-mode-btn');
      var panel = document.getElementById('kv-brand-mode-panel');
      if (!btn || !panel) return;
      panel.hidden = !open;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function applyBrandModeChoice(value) {
      var opt = brandModeOption(value);
      var menu = document.getElementById('kv-brand-mode-menu');
      var select = menu ? menu.querySelector('select[name="brandMode"]') : null;
      var label = document.getElementById('kv-brand-mode-label');
      var current = document.getElementById('kv-brand-mode-value');
      var dot = menu ? menu.querySelector('.kv-brand-mode-dot') : null;
      var panel = document.getElementById('kv-brand-mode-panel');
      if (select) select.value = opt.value;
      if (label) label.textContent = opt.label;
      if (current) current.textContent = opt.value;
      if (dot) dot.className = 'kv-user-role-btn-dot kv-brand-mode-dot ' + opt.value;
      if (panel) {
        Array.prototype.forEach.call(panel.querySelectorAll('[data-action="admin-set-brand-mode"]'), function (btn) {
          var active = btn.getAttribute('data-value') === opt.value;
          btn.classList.toggle('is-active', active);
          btn.setAttribute('aria-selected', active ? 'true' : 'false');
          var check = btn.querySelector('.kv-user-role-option-check');
          if (check) check.textContent = active ? '✓' : '';
        });
      }
      setBrandModePanel(false);
    }

    function moveChapter(mid, chId, dir) {
      var chs = state.data.chapters.filter(function (c) { return c.mangaId === mid; }).sort(function (a, b) { return a.number - b.number; });
      var i = -1;
      chs.forEach(function (c, idx) { if (c.id === chId) i = idx; });
      var j = dir === 'up' ? i - 1 : i + 1;
      if (i === -1 || j < 0 || j >= chs.length) return;
      var first = Object.assign({}, chs[i], { number: chs[j].number });
      var second = Object.assign({}, chs[j], { number: chs[i].number });
      apiSync('/api/admin/save-chapter', first).then(function (ok) {
        if (!ok) return;
        return apiSync('/api/admin/save-chapter', second, 'Urutan chapter diperbarui.');
      });
    }

    function movePage(idx, dir) {
      var f = state.adminChapterForm;
      if (!f) return;
      var j = dir === 'up' ? idx - 1 : idx + 1;
      if (j < 0 || j >= f.pages.length) return;
      var tmp = f.pages[idx]; f.pages[idx] = f.pages[j]; f.pages[j] = tmp;
      reindexPages();
      render();
    }

    function removePage(idx) {
      var f = state.adminChapterForm;

    function performConfirmedDelete() {
      var d = state.pendingDelete;
      state.pendingDelete = null;
      closeConfirmModalDom();
      if (!d) { render(); return; }
      if (d.type === 'manga') {
        state.adminExpandedManga = null;
        apiSync('/api/admin/delete-manga', { id: d.id }, 'Manga beserta chapter & komentarnya dihapus.');
        return;
      } else if (d.type === 'chapter') {
        apiSync('/api/admin/delete-chapter', { id: d.id }, 'Chapter dihapus.');
        return;
      } else if (d.type === 'comment') {
        var doomed = [d.id];
        var added = true;
        while (added) {
          added = false;
          state.data.comments.forEach(function (c) {
            if (c.parentId && doomed.indexOf(c.parentId) !== -1 && doomed.indexOf(c.id) === -1) { doomed.push(c.id); added = true; }
          });
        }
        state.data.comments = state.data.comments.filter(function (c) { return doomed.indexOf(c.id) === -1; });
        doomed.forEach(function (id) { var node = document.getElementById('kv-comment-' + id); if (node) node.remove(); });
        apiSync('/api/admin/delete-comment', { id: d.id }, 'Komentar dihapus.');
        return;
      } else if (d.type === 'user') {
        if (!CONFIG.API_BASE_URL || !state.adminToken) { toast('Backend tidak terhubung.', 'error'); render(); return; }
        fetch(CONFIG.API_BASE_URL + '/api/admin/delete-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.adminToken },
          body: JSON.stringify({ id: d.id })
        }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (isSessionUnauthorized(r)) { clearSession(); throw new Error('Sesi admin berakhir. Silakan login ulang.'); } if (r.status === 401) throw new Error('Gagal menghapus pengguna (HTTP 401).'); if (!r.ok) throw new Error(j.error || 'Gagal menghapus pengguna.'); return j; }); })
          .then(function () { toast('Pengguna dihapus.', 'success'); state.usersCache = undefined; loadAdminUsers(); })
          .catch(function (e) { toast(e.message, 'error'); });
        return;
      }
      render();
    }

    /* Unggah satu berkas per request; gambar disimpan di Telegram dan
       ditayangkan oleh URL proxy Vercel. */
     function compressImageBlob(blob, fileName) {
       return new Promise(function (resolve) {
         if (!blob || !blob.type || blob.type.indexOf('image/') !== 0) { resolve(blob); return; }
         if (state.imageCompressionEnabled === false) { resolve(blob); return; }
         if (blob.size <= 3 * 1024 * 1024) { resolve(blob); return; }
         var img = new Image();
         var url = URL.createObjectURL(blob);
         img.onload = function () {
           URL.revokeObjectURL(url);
           var maxDim = Math.max(500, Math.min(4000, Number(state.imageCompressionMaxDim) || 4000));
           var quality = Math.max(0.1, Math.min(1, Number(state.imageCompressionQuality) || 0.95));
           var w = img.naturalWidth || img.width;
           var h = img.naturalHeight || img.height;
           if (w > maxDim || h > maxDim) {
             var scale = Math.min(maxDim / w, maxDim / h);
             w = Math.round(w * scale);
             h = Math.round(h * scale);
           }
           var canvas = document.createElement('canvas');
           canvas.width = w;
           canvas.height = h;
           var ctx = canvas.getContext('2d');
           ctx.drawImage(img, 0, 0, w, h);
           canvas.toBlob(function (out) {
             if (!out) { resolve(blob); return; }
               if (out.type === 'image/webp') { resolve(out.size < blob.size ? out : blob); return; }
             canvas.toBlob(function (out2) {
               if (!out2 || out2.size >= blob.size) { resolve(blob); return; }
               resolve(out2);
             }, 'image/jpeg', quality);
           }, 'image/webp', quality);
         };
         img.onerror = function () { URL.revokeObjectURL(url); resolve(blob); };
         img.src = url;
       });
     }
     function compressImageFile(file) {
       if (!file || !file.type || file.type.indexOf('image/') !== 0) return Promise.resolve(file);
       return compressImageBlob(file, file.name).then(function (blob) {
         if (blob === file) return file;
         var ext = (blob.type === 'image/webp') ? '.webp' : (blob.type === 'image/jpeg' ? '.jpg' : '');
         var base = String(file.name || 'image').replace(/\.[^.]+$/, '');
         var name = ext ? (base + ext) : file.name;
         try { return new File([blob], name, { type: blob.type || file.type, lastModified: Date.now() }); }
         catch (e) { return file; }
       });
     }
     function mimeFromName(name) {

      var ext = String(name || '').split('.').pop().toLowerCase();
      return ({ jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif' })[ext] || 'image/jpeg';
    }
    function findEocd(bytes) {
      for (var i = bytes.length - 22; i >= 0; i--) {
        if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 0x05 && bytes[i + 3] === 0x06) return i;
      }
      return -1;
    }
    async function extractZipImages(file) {
      var buf = await file.arrayBuffer();
      var bytes = new Uint8Array(buf);
      var eocd = findEocd(bytes);
      if (eocd < 0) throw new Error('ZIP tidak valid');
      var dv = new DataView(bytes.buffer);
      var numEntries = dv.getUint16(eocd + 10, true);
      var cdSize = dv.getUint32(eocd + 12, true);
      var cdOffset = dv.getUint32(eocd + 16, true);
      var pos = cdOffset;
      var entries = [];
      for (var i = 0; i < numEntries; i++) {
        if (dv.getUint32(pos, true) !== 0x02014b50) break;
        var method = dv.getUint16(pos + 10, true);
        var csize = dv.getUint32(pos + 20, true);
        var usize = dv.getUint32(pos + 24, true);
        var fnLen = dv.getUint16(pos + 28, true);
        var extraLen = dv.getUint16(pos + 30, true);
        var commentLen = dv.getUint16(pos + 32, true);
        var localOffset = dv.getUint32(pos + 42, true);
        var name = new TextDecoder().decode(bytes.slice(pos + 46, pos + 46 + fnLen));
        pos += 46 + fnLen + extraLen + commentLen;
        if (name.endsWith('/')) continue;
        var ext = name.split('.').pop().toLowerCase();
        if (['jpg', 'jpeg', 'png', 'webp', 'gif'].indexOf(ext) === -1) continue;
        entries.push({ name: name, method: method, csize: csize, usize: usize, localOffset: localOffset });
      }
      var out = [];
      for (var j = 0; j < entries.length; j++) {
        var e = entries[j];
        var lpos = e.localOffset;
        if (dv.getUint32(lpos, true) !== 0x04034b50) continue;
        var lfnLen = dv.getUint16(lpos + 26, true);
        var lextraLen = dv.getUint16(lpos + 28, true);
        var dataStart = lpos + 30 + lfnLen + lextraLen;
        var cdata = bytes.slice(dataStart, dataStart + e.csize);
        var blob = null;
        if (e.method === 0) {
          blob = new Blob([cdata], { type: mimeFromName(e.name) });
        } else if (e.method === 8) {
          try {
            var ds = new DecompressionStream('deflate-raw');
            var stream = new Blob([cdata]).stream().pipeThrough(ds);
            var ab = await new Response(stream).arrayBuffer();
            blob = new Blob([ab], { type: mimeFromName(e.name) });
          } catch (err) {
            continue;
          }
        } else {
          continue;
        }
        if (!blob) continue;
        out.push(new File([blob], e.name.split('/').pop(), { type: blob.type }));
      }
      return out;
    }
    function uploadOneFile(file, f) {
      return new Promise(function (resolve) {
        var page = { order: f.pages.length + 1, fileName: file.name, bloggerUrl: '', telegramFileId: '', status: 'menunggu unggah' };
        f.pages.push(page);
        if (file.size > 3 * 1024 * 1024) {
          page.status = 'gagal: ukuran maksimal 3 MiB';
          toast('Ukuran ' + file.name + ' melebihi batas 3 MiB untuk backend Vercel.', 'err');
          f.pages = f.pages.filter(function (p) { return p !== page; });
          render();
          resolve();
          return;
        }
        render();
        if (!CONFIG.API_BASE_URL) {
          page.status = 'gagal: backend belum dikonfigurasi';
          toast('Backend belum dikonfigurasi untuk upload halaman.', 'warn');
          render();
          resolve();
          return;
        }
        page.status = 'mengunggah ke proxy...';
        render();
        var fr = new FileReader();
        fr.onload = function () {
          fetch(CONFIG.API_BASE_URL + '/api/admin/upload-dual', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.adminToken },
            body: JSON.stringify({ fileName: file.name, mimeType: file.type || mimeFromName(file.name), dataBase64: fr.result })
          }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (res) {
              if (isSessionUnauthorized(r)) {
                clearSession();
                throw new Error('Sesi admin berakhir. Silakan login ulang.');
              }
              if (r.status === 401) throw new Error('HTTP 401');
              if (!r.ok) throw new Error(res.error || 'HTTP ' + r.status);
              return res;
            });
          }).then(function (res) {
            page.telegramFileId = (res && res.telegramFileId) || '';
            page.bloggerUrl = (res && res.bloggerUrl) || '';
            page.status = 'Telegram: ' + ((res && res.telegramStatus) || 'gagal') + ' | Proxy: ' + ((res && res.bloggerStatus) || 'gagal');
            if (!page.bloggerUrl || !page.telegramFileId) {
              toast('Sebagian tujuan gagal untuk ' + file.name + ' - periksa status lalu unggah ulang.', 'warn');
            }
            render();
            resolve();
          }).catch(function (err) {
            page.status = 'gagal: ' + err.message;
            toast('Gagal mengunggah ' + file.name + ': ' + err.message, 'err');
            if (String(err.message || '').indexOf('Sesi admin berakhir') !== -1) { render(); resolve(); return; }
            render();
            resolve();
          });
        };
        fr.readAsDataURL(file);
      });
    }
    async function uploadPageFiles(files) {
      var f = state.adminChapterForm;
      if (!f) return;
      var collected = [];
      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        var name = String(file.name || '').toLowerCase();
        if (name.endsWith('.zip') || file.type === 'application/zip' || file.type === 'application/x-zip-compressed') {
          try {
            var extracted = await extractZipImages(file);
            if (!extracted.length) toast('ZIP tidak berisi gambar yang didukung.', 'warn');
            collected = collected.concat(extracted);
          } catch (err) {
            toast('Gagal mengekstrak ZIP ' + file.name + ': ' + err.message, 'err');
          }
        } else {
          var compressed = await compressImageFile(file);
          collected.push(compressed);
        }
      }
      if (!collected.length) {
        toast('Tidak ada gambar untuk diunggah.', 'warn');
        render();
        return;
      }
      state.uploadProgress = { active: true, total: collected.length, done: 0, current: collected[0].name };
      render();
      for (var j = 0; j < collected.length; j++) {
        state.uploadProgress.current = collected[j].name;
        state.uploadProgress.done = j;
        render();
        await uploadOneFile(collected[j], f);
        state.uploadProgress.done = j + 1;
        render();
      }
      state.uploadProgress.active = false;
      state.uploadProgress = null;
      render();
      toast('Unggah selesai: ' + collected.length + ' gambar.', 'ok');
    }

      if (key === 'j' || e.key === 'ArrowDown') { window.scrollBy({ top: 400, behavior: scrollBehavior() }); }
      else if (key === 'k' || e.key === 'ArrowUp') { window.scrollBy({ top: -400, behavior: scrollBehavior() }); }
      else if (isPaged && (key === 'arrowleft' || e.key === 'ArrowLeft')) { e.preventDefault(); yzReaderGoPage(-1); window.scrollTo(0, 0); }
      else if (isPaged && (key === 'arrowright' || e.key === ' ')) { e.preventDefault(); yzReaderGoPage(1); window.scrollTo(0, 0); }
      else if (e.key === '[') { e.preventDefault(); yzReaderGoChapter(-1); }
      else if (e.key === ']') { e.preventDefault(); yzReaderGoChapter(1); }
      else if (key === 'v' || key === 'p') { toggleAutoScroll(); }
      else if (key === 'c') { state.readerMenuOpen = !state.readerMenuOpen; state.readerSettingsOpen = false; state.readerServersOpen = false; render(); }
      else if (key === 'f') {
        if (document.fullscreenElement) { document.exitFullscreen().catch(function () {}); }
        else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(function () {}); }
      }
    });

    // Aksesibilitas: elemen interaktif custom (kartu/baris) dapat diaktifkan via Enter/Spasi
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        var brandPanel = document.getElementById('kv-brand-mode-panel');
        if (brandPanel && !brandPanel.hidden) { setBrandModePanel(false); return; }
        if (state.mdLangMenuOpen) { setMdLangMenu(false); var mdLangBtnEsc = document.getElementById('kv-md-lang-btn'); if (mdLangBtnEsc) mdLangBtnEsc.focus(); return; }
        var trafficTip = document.getElementById('kv-traffic-tooltip');
        if (trafficTip && !trafficTip.hidden) { hideTrafficTooltip(); return; }
      }
      if (e.key === 'Escape' && state.headerThemeOpen) {
        state.headerThemeOpen = false;
        render();
        return;
      }
      if (e.key === 'Escape' && state.openCatalogDropdown) {
        state.openCatalogDropdown = null;
        render();
        return;
      }
      if (e.key === 'Escape' && state.adminRoleMenuOpen) {
        state.adminRoleMenuOpen = null;
        render();
        return;
      }
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var t = e.target;
      if (!t || !t.getAttribute) return;
      if (['BUTTON', 'A', 'INPUT', 'SELECT', 'TEXTAREA'].indexOf(t.tagName) !== -1) return;
      if (!t.hasAttribute('data-action')) return;
      e.preventDefault();
      t.click();
    });


    function handleRouteChange() {
      stopAutoScroll();
      if (dockFrame) {
        window.cancelAnimationFrame(dockFrame);
        dockFrame = null;
      }
      if (readerFrameObserver) {
        readerFrameObserver.disconnect();
        readerFrameObserver = null;
      }
      state.readerMenuOpen = false;
      state.readerSettingsOpen = false;
      state.commentNotice = null;
      parseRoute();
      render();
      window.scrollTo(0, 0);
    }

    // Toggle spoiler komentar saat diklik
    document.addEventListener('click', function (e) {
      var sp = e.target && e.target.closest ? e.target.closest('.kv-spoiler-toggle') : null;
      if (!sp) return;
      var box = sp.closest('.kv-spoiler');
      if (box) box.classList.toggle('open');
    });

    window.addEventListener('popstate', handleRouteChange);
    window.addEventListener('hashchange', handleRouteChange);


    window.addEventListener('storage', function (e) {
      if (e.key === 'kv_session_token') {
        var nextToken = e.newValue;
        if (nextToken && nextToken !== state.adminToken) {
          state.adminToken = nextToken;
          state.user = restoreSessionFromCache(decodeSessionClaims(nextToken));
          refreshSession(true);
          render();
        } else if (!nextToken && state.adminToken) {
          clearSession();
          render();
          syncFromApi(true);
        }
        return;
      }
      if (e.key === 'kv_theme') {
        var t = e.newValue;
        if (CONFIG.THEME_IDS.indexOf(t) === -1) t = CONFIG.DEFAULT_THEME;
        if (state.theme !== t) { state.theme = t;  applyTheme(false); render(); }
      }
    });
    var themeMedia = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    if (themeMedia) {
      var onThemePreferenceChange = function () { if (state.theme === 'system') { applyTheme(false); render(); } };
      if (themeMedia.addEventListener) themeMedia.addEventListener('change', onThemePreferenceChange);
      else if (themeMedia.addListener) themeMedia.addListener(onThemePreferenceChange);
    }
    window.addEventListener('online', function () {
      refreshSession(true);
      syncFromApi(true);
    });
    document.addEventListener('visibilitychange', function () {
      document.documentElement.classList.toggle('motion-paused', document.hidden);
      if (document.hidden && readerAutoFrame) {
        stopAutoScroll();
        render();
      }
      if (!document.hidden && navigator.onLine) {
        refreshSession(true);
        syncFromApi(true);
      }
      if (!document.hidden) refreshAnalyticsPeriodIfNeeded();
    });
    document.addEventListener('pointerover', function (e) {
      if (e.pointerType === 'touch' || !e.target.closest) return;
      var p = e.target.closest('[data-traffic-point]');
      if (p) showTrafficTooltip(p);
    });
    document.addEventListener('touchstart', function (e) {
      var p = e.target && e.target.closest ? e.target.closest('[data-traffic-point]') : null;
      if (p) showTrafficTooltip(p);
    }, { passive: true });
    document.addEventListener('focusin', function (e) {
      var p = e.target && e.target.closest ? e.target.closest('[data-traffic-point]') : null;
      if (p) showTrafficTooltip(p);
    });
    setInterval(refreshAnalyticsPeriodIfNeeded, 60000);
            window.__yzHeroTimer = setInterval(function () {
        if (state.route !== 'home' || document.hidden || prefersReducedMotion() || state.heroCount < 2) return;
        if (state.heroDragActive || state.heroAnimating) return;
        if (window.__yzHeroInteractionUntil && Date.now() < window.__yzHeroInteractionUntil) return;
        var carousel = document.querySelector('[data-hero-carousel]');
        var active = document.activeElement;
        if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT' || (active.matches && active.matches(':focus-visible') && carousel && carousel.contains(active)))) return;
        if (carousel && window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches && carousel.matches(':hover')) return;
        var nextHero = heroAdvance(state.activeIndex, 'next', state.heroCount, 1);
        setHeroSlide(nextHero.index, nextHero.direction);
      }, 6500);
applyYumeAccent();
    applyTheme();
     parseRoute();
     initializeAuth();
     trackPageview();
   })();

  
  </script>
</body>
</html>
