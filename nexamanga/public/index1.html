<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NexaManga Vercel Backend</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 40px 20px; background: #0f172a; color: #e2e8f0; }
    .card { max-width: 640px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { line-height: 1.6; color: #cbd5e1; }
    a { color: #38bdf8; }
    code { background: #0f172a; padding: 2px 6px; border-radius: 4px; }
    .status { display: inline-block; margin-top: 16px; padding: 8px 12px; background: #16a34a; color: #fff; border-radius: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>NexaManga Vercel Backend</h1>
    <p>Backend serverless untuk tema Blogger NexaManga. API tersedia di <code>/api/*</code>.</p>
    <p>Periksa status layanan:</p>
    <a class="status" href="/api/health">Cek Health</a>
  </div>
</body>
</html>
